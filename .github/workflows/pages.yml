name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name=="github-pages") | .id' | head -n 1)"
          if [ -z "$artifact_id" ]; then
            echo "github-pages artifact not found" >&2
            exit 1
          fi

          oidc_token="$(curl -sSf -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value')"

          jq -n \
            --argjson artifact_id "$artifact_id" \
            --arg pages_build_version "$GITHUB_SHA" \
            --arg oidc_token "$oidc_token" \
            '{artifact_id:$artifact_id,pages_build_version:$pages_build_version,oidc_token:$oidc_token}' \
            > pages-deployment.json

          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments" \
            --input pages-deployment.json

          for i in $(seq 1 480); do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/pages/deployments/${GITHUB_SHA}" --jq '.status')"
            echo "Pages deployment status: ${status}"
            case "$status" in
              succeed|success)
                page_url="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.html_url')"
                echo "page_url=${page_url}" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              errored|error|failed|failure|cancelled|deployment_cancelled)
                exit 1
                ;;
            esac
            sleep 5
          done

          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments/${GITHUB_SHA}/cancel" || true
          echo "Timed out waiting for GitHub Pages deployment" >&2
          exit 1
